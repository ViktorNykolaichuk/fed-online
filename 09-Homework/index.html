<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="speechify-square">
        <p class="speechify-square-label">Speechify - Square</p>
        <img class="speechify-square-glyph" src="img/Glyph.png" alt="">
        <img class="speechify-square-blue" src="img/Blue.png" alt="">

        <div class="diia-flag">
            <p class="diia-flag-label">Diia - Flag</p>
            <img class="diia-flag-vector" src="img/Vector.png" alt="">
            <div class="diia-flag-ua"></div>
        </div>
    </div>
    <div class="speechify-circle">
        <div class="speechify-circle-yellow"></div>
        <img class="speechify-circle-glyph" src="img/Glyph.png" alt="">
        <img class="speechify-circle-blue" src="img/Blue.png" alt="">
    </div>
    <p class="speechify-circle-label">Speechify - Circle</p>
</body>

</html>
