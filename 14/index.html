<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="img/logo.png" alt="logo room.us">
            </div>


            <nav>
                <a href="#" class="active">Home</a>
                <a href="#">Amenities</a>
                <a href="#">Contact us</a>
            </nav>
            <form class="search-block">
                <input type="search" placeholder="Category" name=search id="searchinput">

                <button>
                    <img src="img/search.png" alt="Search-icon">
                </button>

            </form>
        </div>
    </header>
    <section class="content">
        <div class="container">
            <div class="image-block">
                <img src="img/Rectangle168.png" alt="picture">
            </div>

            <div class="text-container">
                <div class="text-block">
                    <h2>Work Space</h2>
                    <h1>Modern Design work space</h1>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit ut aliquam, purus sit amet
                        luctus venenatis,
                        lectus magna fringilla urna, porttitor rhoncus
                        dolor purus non enim</p>
                </div>
                <div class="social">
                    <div class="video">
                        <button>
                            <img class="" src="img/play-icon.png" alt="play">
                        </button>
                        <span>Watch Video</span>
                    </div>

                    <div class="social-link">
                        <a href="#">
                            <img class="social-link-img" src="img/twitter.png" alt="twitter">
                            <img class="social-link-img-hover" src="img/twitter-hover.png" alt="twitter">
                        </a>
                        <a href="">
                            <img class="social-link-img" src="img/instagram.png" alt="instagram">
                            <img class="social-link-img-hover" src="img/instagram-hover.png" alt="instagram">
                        </a>
                        <a href="">
                            <img class="social-link-img" src="img/facebook.png" alt="facebook">
                            <img class="social-link-img-hover" src="img/facebook-hover.png" alt="facebook">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="client">

        <div class="client-image">
            <img class="img1" src="img/client1.png" alt="Client">
        </div>
        <div class="client-image">
            <img class="img2" src="img/client2.png" alt="Client">
        </div>
        <div class="client-image">
            <img class="img3" src="img/client3.png" alt="Client">
        </div>

        <span class="client-info">
            <strong>235+</strong>
            <span>Client</span>
        </span>

    </section>


</body>

</html>
