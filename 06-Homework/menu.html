<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/menu-style.css">
</head>

<body>
    <div class="container">
        <button class="menu-button">
            <img src="img/menu-button-icon.png" alt="Menu button">
        </button>

        <!--Menu-->
        <div class="menu-text">
            <h2>Menu</h2>
        </div>

        <!--Search field-->
        <form action="" class="food-search-input">
            <input placeholder="Search food here" type="text">
        </form>

        <!--Menu items-->
        <div class="menu-items">
            <div class="menu-position">
                <div class="position-image">
                    <img src="img/food.png" alt="Food">
                </div>
            </div>
            <h4 class="position-title">
                Food
            </h4>
        </div>
        <div class="menu-items">
            <div class="menu-position">
                <div class="position-image">
                    <img src="img/drinks.png" alt="Drinks">
                </div>
            </div>
            <h4 class="position-title">
                Drinks
            </h4>
        </div>
        <div class="menu-items">
            <div class="menu-position">
                <div class="position-image">
                    <img src="img/desert.png" alt="Desert">
                </div>
            </div>
            <h4 class="position-title">
                Desert
            </h4>
        </div>

        <!--Burgers-->
        <div class="burger-title">
            <h2>Burger</h2>
        </div>


        <div class="burger-items">
            <div class="burger-position">
                <img src="img/BigMac.png" alt="Big Mac">
                <div class="burger-info">
                    <p class="burger-name">Big Mac</p>
                    <p class="burger-price">Rs 240</p>
                </div>
            </div>

        </div>
        <div class="burger-items">
            <div class="burger-position">
                <img src="img/KFCdouble.png" alt="KFC Double">
                <div class="burger-info">
                    <p class="burger-name">KFC Double</p>
                    <p class="burger-price">Rs 252</p>
                </div>
            </div>

        </div>
        <div class="burger-items">
            <div class="burger-position">
                <img src="img/FishBurger.png" alt="Fish Burger">
                <div class="burger-info">
                    <p class="burger-name">Fish Burger</p>
                    <p class="burger-price">Rs 220</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
