<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <main>
        <h1>
            <Strong>
                Best Developers
            </Strong>
            On The Planet
        </h1>
        <p class="sub-title-text">This Product integrates with your favorite apps to automate workflows and ensure
            smooth, productive work days.</p>
        <div class="card-row clearfix">
            <div class="user-card">
                <div class="user-photo"><img src="img/DanBurykin.png" alt="user"></div>
                <h4>Dan Burykin</h4>
                <p>Vue.JS Developer</p>
                <div class="skills">
                    <div class="skill-item vue">
                        <img src="img/Vue.png" alt="logo">
                    </div>
                </div>
            </div>

            <div class="user-card">
                <div class="user-photo"><img src="img/EsiDoda.png" alt="user"></div>
                <h4>Esi Doda</h4>
                <p>Software Developer</p>
                <div class="skills">
                    <div class="skill-item ang">
                        <img src="img/Angular.png" alt="logo">
                    </div>
                    <div class="skill-item flut">
                        <img src="img/Flutter.png" alt="logo">
                    </div>
                    <div class="skill-item reactJS">
                        <img src="img/React.png" alt="logo">
                    </div>
                </div>
            </div>

            <div class="user-card">
                <div class="user-photo"><img src="img/AlexHarper.jpg" alt="user"></div>
                <h4>Alex Harper</h4>
                <p>RN Executive</p>
                <div class="skills">
                    <div class="skill-item java">
                        <img src="img/Java.png" alt="logo">
                    </div>
                    <div class="skill-item reactNat">
                        <img src="img/React.png" alt="logo">
                    </div>
                </div>
            </div>

            <div class="user-card">
                <div class="user-photo"><img src="img/AmarnaMiller.jpg" alt="user"></div>
                <h4>Amarna Miller</h4>
                <p>Frontend Wizard</p>
                <div class="skills">
                    <div class="skill-item html">
                        <img src="img/Html.png" alt="logo">
                    </div>
                    <div class="skill-item css">
                        <img src="img/Css.png" alt="logo">
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
