<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/pre.css">
</head>

<body>
    <section class="simple-animations">
        <button class="fill-in">
            Fill In
        </button>

        <button class="glowing">
            Glowing
        </button>

        <button class="fill-up">
            Fill Up
        </button>

        <button class="slide">
            Slide
        </button>

        <button class="raise">
            Raise
        </button>

        <button class="close">
            Close
        </button>

        <button class="notify-me">
            <span>Thanks</span>
            <span>Notify Me</span>
        </button>

        <button class="hover-me">
            Hove<span>r Me</span>
        </button>

        <button class="zoom">
            Zoom
        </button>

        <button class="offset">
            <div class="offset-main">
                Offset
            </div>
            <div class="offset-background"></div>
        </button>

        <button class="explore-more">
            <span>Explore more</span>
            <i class="fa-solid fa-arrow-right-long"></i>
        </button>

        <div class="fancy-button">
            <button>
                Fancy Button
            </button>
            <div class="left-borders"></div>
            <div class="right-borders"></div>
        </div>

    </section>
    <section class="cool-animations">
        <button class="hover-me-second">
            <span>Hover Me</span>
        </button>
        <button class="explore-more-second">
            <span>Explore more</span>
            <img class="green" src="img/Rectangle-green.png" alt="">
            <img class="blue" src="img/Rectangle-blue.png" alt="">
        </button>
    </section>
</body>

</html>
